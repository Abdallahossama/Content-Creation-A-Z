 font-size:118px;line-height:1.15;color:#fff;white-space:nowrap}

</style></head><body><div class="cap"><span class="w">كاملة</span></div><script>document.fonts.ready.then(()=>{const c=document.querySelector('.cap');const w=()=>{let a=1e9,b=-1e9;c.querySelectorAll(':scope>span').forEach(e=>{const r=e.getBoundingClientRect();a=Math.min(a,r.left);b=Math.max(b,r.right)});return b-a};let f=118;while(w()>840&&f>60){f-=3;c.style.fontSize=f+'px';c.style.gap=(26*f/118)+'px'}})</script></body></html>
