html,body{margin:0;background:transparent;overflow:hidden}
*{box-sizing:border-box}
body{font-family:A,sans-serif;color:#121212}
.hl{background:#B9DD74;color:#121212;padding:0 .22em;border-radius:2px;display:inline-block}

body{width:1080px;height:300px;position:relative}
.cap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;
  direction:rtl;font-size:74px;line-height:1.25;padding:0 40px;flex-wrap:nowrap;white-space:nowrap}

.s{font-family:SR,serif;font-size:118px;color:#fff;line-height:1;transform:skewX(-9deg) translateY(4px);
  text-shadow:0 4px 14px rgba(0,0,0,.65)}

</style></head><body><svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter></svg><div class="cap" style="padding:0 70px"><span class="t">من</span><span class="p">A to Z</span></div><script>document.fonts.ready.then(()=>{const c=document.querySelector('.cap');const w=()=>{let a=1e9,b=-1e9;c.querySelectorAll('span').forEach(e=>{const r=e.getBoundingClientRect();a=Math.min(a,r.left);b=Math.max(b,r.right)});return b-a};let f=74,k=1;while(w()>950&&f>48){f-=2;k=f/74;c.style.fontSize=f+'px';c.style.gap=(22*k)+'px';c.querySelectorAll('.p,.s,.g,.g2').forEach(e=>{e.style.fontSize=''})}})</script></body></html>
